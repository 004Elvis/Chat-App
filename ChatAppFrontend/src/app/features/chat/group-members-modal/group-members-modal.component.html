<div class="modal-backdrop" (click)="close()">
  <div class="modal-card" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <div>
        <h3>Group Members</h3>
        <p>{{ members.length }} members</p>
      </div>
      <button type="button" class="close-btn" (click)="close()" aria-label="Close">×</button>
    </div>

    <div class="member-list">
      @for (member of members; track member.id) {
        <div class="member-item">
          <div class="member-avatar">
            @if (member.avatarUrl) {
              <img [src]="member.avatarUrl" [alt]="member.userName" />
            } @else {
              <span>{{ getInitials(member.userName) }}</span>
            }
          </div>
          <div class="member-info">
            <div class="member-name">
              {{ member.userName }}
              @if (member.id === currentUser?.id) {
                <span class="badge">You</span>
              }
            </div>
            <div class="member-email">{{ member.email || 'No email available' }}</div>
          </div>
        </div>
      }
    </div>
  </div>
</div>
